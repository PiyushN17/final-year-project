<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Data Center | KrishiGyaan</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="refresh.css?v=8" />
  </head>
  <body data-page="admin-dashboard">
    <header class="admin-header">
      <a class="brand" href="index.html">KrishiGyaan Admin</a>
      <button class="dashboard-logout" id="adminLogoutBtn">Logout</button>
    </header>
    <main class="admin-layout">
      <aside class="admin-users-panel">
        <h1>Farmer records</h1>
        <p id="adminUserCount">Loading users...</p>
        <button class="btn btn-primary admin-create-button" id="adminCreateUserBtn" type="button">Add farmer</button>
        <label class="admin-search-label">Search<input id="adminUserSearch" type="search" placeholder="Name or mobile" /></label>
        <div class="admin-user-list" id="adminUserList"></div>
      </aside>
      <section class="admin-detail" id="adminFarmerDetail">
        <div class="admin-empty">Select a farmer to view saved dashboard data.</div>
      </section>
    </main>
    <script src="admin.js?v=2"></script>
  </body>
</html>
