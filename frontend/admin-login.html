<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | KrishiGyaan</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="refresh.css?v=8" />
  </head>
  <body data-page="admin-login">
    <main class="admin-login-page">
      <form class="admin-login-card" id="adminLoginForm">
        <a class="brand" href="index.html">KrishiGyaan</a>
        <h1>Admin login</h1>
        <p>Login to view registered farmer records and saved dashboard results.</p>
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="btn btn-primary" type="submit">Login</button>
        <p class="form-note" id="adminLoginNote" role="status"></p>
        <a class="admin-back-link" href="index.html">Back to home</a>
      </form>
    </main>
    <script src="admin.js?v=2"></script>
  </body>
</html>
